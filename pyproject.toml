[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrltea-studio"
version = "1.0.0"
description = "Local Arabic lecture authoring studio"
requires-python = ">=3.11"
dependencies = ["argon2-cffi>=25,<26", "email-validator>=2.2,<3", "Pillow>=10,<13", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "python-multipart>=0.0.20,<1", "PyMuPDF>=1.24,<2", "python-docx>=1.1,<2", "lxml>=5,<7", "matplotlib>=3.9,<4", "numpy>=2,<3", "cairosvg>=2.7,<3; sys_platform != 'win32'", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4", "alembic>=1.14,<2"]
test = ["pytest>=8", "httpx>=0.27", "playwright>=1.51"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.setuptools.package-data]
ctrltea = ["skills/ctrltea-lecture-authoring/SKILL.md", "skills/ctrltea-lecture-authoring/references/*.md", "skills/ctrltea-lecture-authoring/scripts/*.py"]
